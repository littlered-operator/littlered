{{- if ne (include "littlered.scopeMode" .) "allow" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "littlered.fullname" . }}-manager
  labels:
    {{- include "littlered.labels" . | nindent 4 }}
rules:
  {{- include "littlered.managerRules" . | nindent 2 }}
{{- end }}
