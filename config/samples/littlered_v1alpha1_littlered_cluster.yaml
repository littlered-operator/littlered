# Example: Redis Cluster mode
# This creates a 3-shard cluster with 1 replica per shard (6 pods total)
# Data is distributed across shards using hash slots (16384 slots total)
#
# Key points:
# - No PersistentVolumes needed - cluster state stored in CR status
# - Operator handles recovery on pod restarts
# - In-memory mode - data is lost on full cluster restart (no persistence)
#
# Usage:
#   kubectl apply -f littlered_v1alpha1_littlered_cluster.yaml
#
# Cluster mode runs one StatefulSet per shard ({name}-shard-K); pod {name}-shard-K-0 is
# shard K's master and {name}-shard-K-1..R are its replicas.
#
# Check cluster status:
#   kubectl get littlered store-cluster -o jsonpath='{.status.cluster}'
#   kubectl exec store-cluster-shard-0-0 -- redis-cli CLUSTER INFO
#   kubectl exec store-cluster-shard-0-0 -- redis-cli CLUSTER NODES
#   lrctl verify store-cluster   # cross-checks health + shard-colocation
#
apiVersion: redis.chuck-chuck-chuck.net/v1alpha1
kind: LittleRed
metadata:
  name: store-cluster
spec:
  mode: cluster
  cluster:
    # Number of master shards (minimum 3 for Redis Cluster)
    shards: 3
    # Replicas per shard (0 = no replicas, 1 = one replica per master)
    replicasPerShard: 1
    # Cluster node timeout in milliseconds
    clusterNodeTimeout: 15000
  # Per-shard failure-domain isolation (cluster mode). The operator spreads each shard's
  # master + replica(s) across the given topology domain so a single node/zone loss can't
  # take a whole shard. Optional; omit to place pods without per-shard isolation.
  placement:
    shardAntiAffinity:
      # Failure domain: kubernetes.io/hostname (node) or topology.kubernetes.io/zone.
      topologyKey: kubernetes.io/hostname
      # ScheduleAnyway (default, best-effort) or DoNotSchedule (hard; may leave pods
      # Pending when there are fewer domains than a shard has pods).
      whenUnsatisfiable: ScheduleAnyway
  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m
  config:
    # Eviction policy (defaults to noeviction)
    maxmemoryPolicy: noeviction
